<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="T&C Live World: live flights, ISS, earthquakes, weather, markets, cyber threats, news and more.">
<title>T&amp;C Live World</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#eef1f8;--g:rgba(255,255,255,.58);--gb:rgba(255,255,255,.75);--t:#1d1d1f;--t2:#6e6e73;--a:#0a84ff;--in:rgba(120,120,128,.14);--sh:0 10px 40px rgba(20,30,70,.12)}
:root[data-theme=dark]{--bg:#09090d;--g:rgba(38,38,50,.55);--gb:rgba(255,255,255,.13);--t:#f5f5f7;--t2:#a1a1a6;--in:rgba(120,120,128,.3);--sh:0 10px 40px rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--t);background:var(--bg);min-height:100vh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(45vw 45vw at 8% 8%,#5e5ce666,transparent),radial-gradient(45vw 45vw at 92% 18%,#0a84ff55,transparent),radial-gradient(55vw 55vw at 55% 105%,#ff375f44,transparent)}
.wrap{max-width:1240px;margin:0 auto;padding:12px;display:grid;gap:14px}
.glass{background:var(--g);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);border-radius:26px;box-shadow:var(--sh)}
header{position:sticky;top:8px;z-index:900;display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 16px}
.brand{flex:1 1 220px}
h1{font-size:clamp(22px,4vw,30px);font-weight:700;letter-spacing:-.02em;line-height:1.1}
.sub{color:var(--t2);font-size:13px;margin-top:2px}
input,select,textarea{font:inherit;color:var(--t);background:var(--in);border:0;border-radius:14px;padding:10px 14px;outline:0;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{box-shadow:0 0 0 3px #0a84ff88}
#s{flex:2 1 240px}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:9px 16px;background:var(--in);color:var(--t);cursor:pointer;transition:transform .15s,background .2s}
button:active{transform:scale(.96)}
button.p,button.on{background:var(--a);color:#fff}
.ic{padding:9px 13px}
.mapc{position:relative;overflow:hidden;height:clamp(320px,56vh,580px)}
#map{position:absolute;inset:0;background:transparent}
:root[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.chips{position:absolute;z-index:500;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px}
.chips button{-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);background:var(--g);border:1px solid var(--gb);font-size:14px}
.chips button.on{background:var(--a)}
.leaflet-popup-content-wrapper{border-radius:16px}
.iss{font-size:26px;text-align:center}
#tabs{display:flex;gap:8px;overflow-x:auto;padding:10px;scrollbar-width:none}
#tabs button{white-space:nowrap;flex:0 0 auto}
#panel{padding:18px;min-height:220px;display:grid;gap:10px;align-content:start}
.m,small{color:var(--t2)}
.big{font-size:clamp(24px,5vw,38px);font-weight:700;letter-spacing:-.02em}
.big small{font-size:16px;font-weight:500;margin-left:8px}
.list{display:grid;gap:8px}
.list a,.row,.msg{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;background:var(--in);border-radius:16px;color:inherit;text-decoration:none}
.list a{flex-direction:column}
.list small{font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.card{background:var(--in);border-radius:18px;padding:12px;text-align:center}
.up{color:#30d158;font-style:normal}.dn{color:#ff453a;font-style:normal}
iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:18px;background:#000}
.bar{display:flex;gap:8px}.bar input{flex:1}
.msg{display:block;white-space:pre-wrap}
.me{background:#0a84ff33}
h3{font-size:15px;margin-top:6px}
footer{text-align:center;color:var(--t2);font-size:13px;padding:6px 0 18px}
#toasts{position:fixed;z-index:2000;top:calc(env(safe-area-inset-top) + 76px);right:12px;display:grid;gap:8px;max-width:min(360px,calc(100vw - 24px))}
.toast{padding:12px 16px;border-radius:18px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(-8px) scale(.97)}}
dialog{margin:auto;width:min(440px,calc(100vw - 24px));padding:22px;color:var(--t);border:1px solid var(--gb);background:var(--g);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);border-radius:28px;box-shadow:var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
dialog label{display:grid;gap:5px;margin:12px 0;font-size:14px;color:var(--t2)}
dialog .bar{margin-top:14px;flex-wrap:wrap}
@media(max-width:600px){#toasts{left:12px}.wrap{padding:8px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header class="glass">
  <div class="brand"><h1>T&amp;C Live World</h1><div class="sub">From New Modern Mission</div></div>
  <input id="s" type="search" placeholder="Search any city or place" aria-label="Search a place">
  <button class="ic" onclick="locate()" title="My location" aria-label="My location">📍</button>
  <button class="ic" onclick="notif()" title="Enable alerts" aria-label="Enable alerts">🔔</button>
  <button class="ic" onclick="theme()" title="Light or dark" aria-label="Light or dark">🌓</button>
  <button class="ic" onclick="$('#set').showModal()" title="Settings" aria-label="Settings">⚙️</button>
</header>

<section class="glass mapc">
  <div id="map"></div>
  <div class="chips" id="chips"></div>
</section>

<nav class="glass" id="tabs" aria-label="Data panels"></nav>
<section class="glass" id="panel" aria-live="polite"></section>
<footer>Build and Developed by Murali Manohar &amp; Claude-Sonnet</footer>
</div>

<div id="toasts"></div>

<dialog id="set">
  <h2>Settings</h2>
  <p class="m">Keys stay in this browser only. Everything else works without a key.</p>
  <label>Finnhub key (stocks)<input id="fh" type="password" autocomplete="off"></label>
  <label>EIA key (fuel prices)<input id="eia" type="password" autocomplete="off"></label>
  <label>Anthropic API key (AI agent)<input id="ak" type="password" autocomplete="off"></label>
  <div class="bar"><button class="p" onclick="save()">Save settings</button><button onclick="$('#set').close()">Close</button></div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const ls=(k,v)=>v===undefined?(localStorage.getItem(k)||''):localStorage.setItem(k,v);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const J=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.json()};
const R=(a,b)=>`<div class="row"><span>${a}</span><span>${b}</span></div>`;
const S={loc:{name:'London',country:'UK',latitude:51.51,longitude:-0.13}},CTX={},HIST=[];
function toast(m){const t=document.createElement('div');t.className='toast glass';t.textContent=m;$('#toasts').append(t);setTimeout(()=>t.remove(),5000)}

/* theme + settings */
const th=ls('th')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
document.documentElement.dataset.theme=th;
function theme(){const n=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=n;ls('th',n)}
['fh','eia','ak'].forEach(k=>$('#'+k).value=ls(k));
function save(){['fh','eia','ak'].forEach(k=>ls(k,$('#'+k).value.trim()));$('#set').close();toast('Settings saved');show(S.tab)}
function notif(){if(!('Notification'in window))return toast('This browser has no alert support');Notification.requestPermission().then(p=>toast(p=='granted'?'Alerts on for major earthquakes':'Alerts blocked'))}
function locate(){navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{S.loc={name:'Your location',latitude:p.coords.latitude,longitude:p.coords.longitude};map.flyTo([p.coords.latitude,p.coords.longitude],8);show('weather')},()=>toast('Location permission denied')):toast('Location not supported')}

/* map */
const map=L.map('map',{worldCopyJump:true,zoomControl:true}).setView([22,30],2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(map);
const issM=L.marker([0,0],{icon:L.divIcon({html:'🛰️',className:'iss',iconSize:[30,30]})});
const lay={quakes:L.layerGroup(),iss:L.layerGroup([issM]),flights:L.layerGroup(),mil:L.layerGroup()};
const names={quakes:'🌍 Earthquakes',iss:'🛰️ ISS',flights:'✈️ Flights',mil:'🎖️ Military'};
const load={quakes:()=>quakes(),iss:()=>iss(),flights:()=>flights(),mil:()=>mil()};
$('#chips').innerHTML=Object.keys(names).map(k=>`<button id="c-${k}" onclick="tog('${k}')">${names[k]}</button>`).join('')+'<button onclick="map.setView([22,30],2)">⤢ Reset view</button>';
function tog(k){const on=map.hasLayer(lay[k]);on?map.removeLayer(lay[k]):(lay[k].addTo(map),load[k]());$('#c-'+k).classList.toggle('on',!on)}
const seen=new Set();
async function quakes(){try{const d=await J('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');lay.quakes.clearLayers();
 CTX.quakes=d.features.slice(0,8).map(f=>f.properties.title);
 d.features.forEach(f=>{const[m,[x,y]]=[f.properties.mag,f.geometry.coordinates];
  L.circleMarker([y,x],{radius:Math.max(4,m*2.4),color:m>=5?'#ff453a':'#ff9f0a',fillOpacity:.45}).bindPopup(`<b>M${m}</b><br>${esc(f.properties.place)}<br>${new Date(f.properties.time).toLocaleString()}`).addTo(lay.quakes);
  if(m>=6&&!seen.has(f.id)){seen.add(f.id);toast(`Earthquake M${m}: ${f.properties.place}`);if(Notification.permission=='granted')new Notification('Earthquake M'+m,{body:f.properties.place})}})}catch{toast('Earthquake feed unavailable')}}
async function iss(){try{const d=await J('https://api.wheretheiss.at/v1/satellites/25544');CTX.iss=d;issM.setLatLng([d.latitude,d.longitude]);if(S.tab=='space'&&$('#iss'))$('#iss').textContent=issTxt()}catch{}}
const issTxt=()=>CTX.iss?`${CTX.iss.latitude.toFixed(2)}°, ${CTX.iss.longitude.toFixed(2)}° · ${CTX.iss.altitude.toFixed(0)} km · ${CTX.iss.velocity|0} km/h`:'locating…';
let ft;
async function flights(){if(!map.hasLayer(lay.flights))return;if(map.getZoom()<4)return toast('Zoom in to level 4 or higher to load live flights');
 const b=map.getBounds(),c=(v,a)=>Math.max(-a,Math.min(a,v));
 try{const d=await J(`https://opensky-network.org/api/states/all?lamin=${c(b.getSouth(),90)}&lomin=${c(b.getWest(),180)}&lamax=${c(b.getNorth(),90)}&lomax=${c(b.getEast(),180)}`);lay.flights.clearLayers();
 (d.states||[]).slice(0,400).forEach(s=>s[5]!=null&&L.circleMarker([s[6],s[5]],{radius:3,color:'#0a84ff'}).bindPopup(`✈️ ${esc((s[1]||s[0]).trim())}<br>${Math.round(s[7]||0)} m · ${Math.round((s[9]||0)*3.6)} km/h`).addTo(lay.flights))}catch{toast('Flight feed is busy. Try again in a minute.')}}
async function mil(){if(!map.hasLayer(lay.mil))return;try{const d=await J('https://api.adsb.lol/v2/mil');lay.mil.clearLayers();(d.ac||[]).forEach(a=>a.lat!=null&&L.circleMarker([a.lat,a.lon],{radius:4,color:'#ff453a'}).bindPopup(`🎖️ ${esc((a.flight||a.hex).trim())} ${esc(a.t||'')}<br>${esc(a.alt_baro||'')} ft`).addTo(lay.mil));toast((d.ac||[]).length+' military aircraft tracked')}catch{toast('Military flight feed unavailable')}}
map.on('moveend',()=>{clearTimeout(ft);ft=setTimeout(flights,900)});
setInterval(iss,6000);setInterval(()=>map.hasLayer(lay.quakes)&&quakes(),3e5);setInterval(()=>map.hasLayer(lay.mil)&&mil(),45e3);
tog('quakes');tog('iss');

/* search */
$('#s').addEventListener('keydown',async e=>{if(e.key!='Enter')return;const q=e.target.value.trim();if(!q)return;
 try{const g=(await J('https://geocoding-api.open-meteo.com/v1/search?count=1&name='+encodeURIComponent(q))).results?.[0];if(!g)return toast('No place found. Try a city name.');S.loc=g;map.flyTo([g.latitude,g.longitude],7);show('weather')}catch{toast('Search failed. Check your connection.')}});

/* panels */
const wx=c=>c==0?'☀️':c<4?'⛅':c<50?'🌫️':c<70?'🌧️':c<80?'❄️':c<90?'🌦️':'⛈️';
const feeds={'BBC World':'https://feeds.bbci.co.uk/news/world/rss.xml','Al Jazeera':'https://www.aljazeera.com/xml/rss/all.xml','The Guardian':'https://www.theguardian.com/world/rss','DW':'https://rss.dw.com/rdf/rss-en-all'};
const tv={'Al Jazeera English':'UCNye-wNBqNL5ZzHSJj3l8Bg','Sky News':'UCoMdktPbSTixAyNGwb-UYkQ','DW News':'UCknLrEdhRCp1aegoMqRaCZg','France 24':'UCQfwfsi5VrQ8yKZ-UWmAEFg','NASA':'UCLA_DiR1FfKNvjuUpBHmylQ'};
const opts=(o,cur)=>Object.entries(o).map(([k,v])=>`<option value="${v}" ${v==cur?'selected':''}>${k}</option>`).join('');
const P={
news:async()=>{const u=ls('feed')||Object.values(feeds)[0];const d=await J('https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(u));CTX.news=d.items.slice(0,6).map(i=>i.title);
 return `<select onchange="ls('feed',this.value);show('news')" aria-label="News source">${opts(feeds,u)}</select><div class="list">${d.items.slice(0,12).map(i=>`<a href="${esc(i.link)}" target="_blank" rel="noopener"><b>${esc(i.title)}</b><small>${new Date(i.pubDate).toLocaleString()}</small></a>`).join('')}</div>`},
weather:async()=>{const g=S.loc,d=await J(`https://api.open-meteo.com/v1/forecast?latitude=${g.latitude}&longitude=${g.longitude}&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`),c=d.current;
 CTX.weather=`${g.name}: ${c.temperature_2m}°C, wind ${c.wind_speed_10m} km/h`;
 return `<div class="big">${wx(c.weather_code)} ${c.temperature_2m}°C<small>${esc(g.name)}${g.country?', '+esc(g.country):''}</small></div><p class="m">Feels like ${c.apparent_temperature}° · Humidity ${c.relative_humidity_2m}% · Wind ${c.wind_speed_10m} km/h</p><div class="grid">${d.daily.time.slice(0,6).map((t,i)=>`<div class="card"><b>${new Date(t).toLocaleDateString([],{weekday:'short'})}</b><br>${wx(d.daily.weather_code[i])}<br>${Math.round(d.daily.temperature_2m_max[i])}° / ${Math.round(d.daily.temperature_2m_min[i])}°</div>`).join('')}</div><p class="m">Search any city above to change the location.</p>`},
markets:async()=>{const c=await J('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&ids=bitcoin,ethereum,solana,ripple,dogecoin&price_change_percentage=24h'),k=ls('fh'),sy=ls('sy')||'AAPL,MSFT,NVDA,TSLA,GOOGL',ch=v=>v==null?'':`<em class="${v>=0?'up':'dn'}">${v.toFixed(2)}%</em>`;
 let st='<p class="m">Add a free Finnhub key in Settings to see stocks.</p>';
 if(k){const l=sy.split(',').map(s=>s.trim()).filter(Boolean),q=await Promise.all(l.map(s=>J(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(s)}&token=${k}`).catch(()=>({}))));st=l.map((s,i)=>R(esc(s),`$${q[i].c??'–'} ${ch(q[i].dp)}`)).join('')}
 CTX.markets=c.map(x=>x.symbol+' $'+x.current_price).join(', ');
 return `<h3>Stocks</h3><input value="${esc(sy)}" onchange="ls('sy',this.value);show('markets')" aria-label="Stock symbols">${st}<h3>Crypto</h3>${c.map(x=>R(esc(x.name),`$${x.current_price.toLocaleString()} ${ch(x.price_change_percentage_24h)}`)).join('')}`},
cyber:async()=>{const d=await J('https://feodotracker.abuse.ch/downloads/ipblocklist.json');return `<p class="m">Latest botnet command servers from abuse.ch Feodo Tracker</p>`+d.slice(0,15).map(x=>R(esc(x.ip_address)+':'+esc(x.port),esc(x.malware)+' · '+esc(x.country||'?')+' · '+esc(x.status||''))).join('')},
space:async()=>{const s=await J('https://celestrak.org/NORAD/elements/gp.php?GROUP=stations&FORMAT=json').catch(()=>[]);return `<p class="m">International Space Station, live</p><div class="big" id="iss">${issTxt()}</div><h3>Space stations and visiting craft</h3>`+(s.length?s.slice(0,15).map(x=>R(esc(x.OBJECT_NAME),(1440/x.MEAN_MOTION).toFixed(1)+' min orbit · '+x.INCLINATION+'°')).join(''):'<p class="m">CelesTrak is unavailable right now.</p>')},
tv:async()=>{const c=ls('tv')||Object.values(tv)[0];return `<select onchange="ls('tv',this.value);show('tv')" aria-label="Live channel">${opts(tv,c)}</select><iframe src="https://www.youtube.com/embed/live_stream?channel=${encodeURIComponent(c)}" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen title="Live stream"></iframe><p class="m">If a channel is offline, pick another one.</p>`},
fuel:async()=>{const k=ls('eia');if(!k)return '<p class="m">Add a free EIA key in Settings to see oil prices.</p>';const d=await J(`https://api.eia.gov/v2/petroleum/pri/spt/data/?api_key=${k}&frequency=daily&data[0]=value&facets[series][]=RWTC&facets[series][]=RBRTE&sort[0][column]=period&sort[0][direction]=desc&length=10`);return `<p class="m">Daily crude oil spot prices (US EIA)</p>`+d.response.data.map(x=>R(esc(x['series-description']||x.series),esc(x.period)+' · $'+esc(x.value)+'/bbl')).join('')},
food:async()=>{const c=(ls('cc')||'WLD').toUpperCase().replace(/[^A-Z]/g,'').slice(0,3),g=async i=>((await J(`https://api.worldbank.org/v2/country/${c}/indicator/${i}?format=json&mrv=6`))[1])||[];const[a,b]=await Promise.all([g('AG.PRD.FOOD.XD'),g('FP.CPI.TOTL.ZG')]);
 return `<input value="${c}" placeholder="3-letter code: IND, USA, WLD" onchange="ls('cc',this.value);show('food')" aria-label="Country code"><h3>Food production index (2014-16 = 100)</h3>${a.map(x=>R(x.date,x.value==null?'–':x.value.toFixed(1))).join('')||'<p class="m">No data for this code.</p>'}<h3>Consumer price inflation (%)</h3>${b.map(x=>R(x.date,x.value==null?'–':x.value.toFixed(1))).join('')}<p class="m">Source: World Bank</p>`},
ai:async()=>`<p class="m">Ask Claude about the live data on this page. Add your Anthropic API key in Settings first.</p><div class="list" id="chat">${HIST.map(m=>`<div class="msg ${m.role=='user'?'me':''}">${esc(m.content)}</div>`).join('')}</div><div class="bar"><input id="q" placeholder="What are the biggest quakes today?" onkeydown="event.key=='Enter'&&ask()" aria-label="Ask the AI agent"><button class="p" onclick="ask()">Send</button></div>`
};
const T={news:'📰 News',weather:'⛅ Weather',markets:'📈 Markets',cyber:'🛡️ Cyber',space:'🛰️ Space',tv:'📺 Live TV',fuel:'⛽ Fuel',food:'🌾 Food',ai:'✨ AI Agent'};
$('#tabs').innerHTML=Object.entries(T).map(([k,v])=>`<button data-t="${k}" onclick="show('${k}')">${v}</button>`).join('');
async function show(t){S.tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));$('#panel').innerHTML='<p class="m">Loading…</p>';
 try{$('#panel').innerHTML=await P[t]()}catch{$('#panel').innerHTML=`<p class="m">This feed didn’t load. It may be offline, rate-limited, or blocked by the provider in browsers.</p><div><button class="p" onclick="show('${t}')">Retry</button></div>`}}
async function ask(){const k=ls('ak');if(!k)return toast('Add your Anthropic API key in Settings');const q=$('#q').value.trim();if(!q)return;$('#q').value='';HIST.push({role:'user',content:q});show('ai');
 try{const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':k,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:800,system:'You are the assistant inside T&C Live World. Answer briefly. Live context: '+JSON.stringify(CTX),messages:HIST})});
 const d=await r.json();HIST.push({role:'assistant',content:d.content?.[0]?.text||d.error?.message||'No reply'})}catch{HIST.push({role:'assistant',content:'Request failed. Check your key and connection.'})}show('ai')}
show('news');quakes();iss();
</script>
</body>
</html>
